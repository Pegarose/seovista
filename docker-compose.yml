# SeoVista Sprint 0 — disposable local persistence and transport.
# PostgreSQL 16 and Redis 7 are bound to loopback only to avoid exposing
# project data to the local network. Ports 5433, 5434 and 6379 are off-limits
# and are never used by this project.

# Compose project identity is supplied per run with `docker compose -p <identity>`.
# Never add fixed container, network, or volume names here. Compose prefixes every
# generated resource with that project identity, so an owned lifecycle can clean
# up only the resources it created.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seovista
      POSTGRES_PASSWORD: seovista
      POSTGRES_DB: ${SEOVISTA_DATABASE_NAME:-seovista}
      SEOVISTA_DATABASE_NAME: ${SEOVISTA_DATABASE_NAME:-seovista}
    ports:
      - "127.0.0.1:${SEOVISTA_POSTGRES_PORT:-8543}:5432"
    labels:
      com.seovista.lifecycle.token: ${SEOVISTA_OWNERSHIP_TOKEN:?missing ownership token}
    volumes:
      - seovista-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seovista -d $${SEOVISTA_DATABASE_NAME:-seovista}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${SEOVISTA_REDIS_PORT:-8637}:6379"
    labels:
      com.seovista.lifecycle.token: ${SEOVISTA_OWNERSHIP_TOKEN:?missing ownership token}
    volumes:
      - seovista-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction

  # Optional SearXNG instance for the Keyword Rank Checker. Profile-gated so a
  # plain `docker compose up` never starts it: opt in with
  # `docker compose --profile searxng up`. When this service is not running
  # (and SEARXNG_BASE_URL is unset), the worker uses its deterministic mock
  # provider instead. Loopback-only, read-only config mount.
  searxng:
    image: searxng/searxng:latest
    profiles:
      - searxng
    ports:
      - "127.0.0.1:${SEOVISTA_SEARXNG_PORT:-8088}:8080"
    labels:
      com.seovista.lifecycle.token: ${SEOVISTA_OWNERSHIP_TOKEN:?missing ownership token}
    volumes:
      - ./fixtures/searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  default:
    labels:
      com.seovista.lifecycle.token: ${SEOVISTA_OWNERSHIP_TOKEN:?missing ownership token}

volumes:
  seovista-postgres-data:
    labels:
      com.seovista.lifecycle.token: ${SEOVISTA_OWNERSHIP_TOKEN:?missing ownership token}
  seovista-redis-data:
    labels:
      com.seovista.lifecycle.token: ${SEOVISTA_OWNERSHIP_TOKEN:?missing ownership token}
